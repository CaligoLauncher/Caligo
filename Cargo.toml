[package]
name = "caligo"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tempfile = "3"

[target.'cfg(target_os = "windows")'.dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["windows-manifest"] }
raw-window-handle = "0.6"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(not(target_os = "windows"))'.dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["x11", "font-kit"] }

[profile.release]
lto = "thin"
strip = true